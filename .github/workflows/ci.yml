name: CI
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest
      - run: python -m json.tool schemas/metadata-result.schema.json >/dev/null
      - run: python -m py_compile src/*.py
      - run: python -m pip install fastapi uvicorn
      - run: python -c "from fastapi.testclient import TestClient; from src.api import app; r=TestClient(app).get('/healthz'); assert r.status_code == 200"
