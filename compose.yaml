name: asset-metadata-service

services:
  metadata:
    build: .
    image: ${METADATA_IMAGE:-asset-metadata-service:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${METADATA_PORT:-8080}:8080"
    environment:
      METADATA_CONTRACT_VERSION: metadata-contract-v0.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 20s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=1024m
    networks:
      - default
      - shared

networks:
  # 共享网络的实际名称由 SHARED_NETWORK 决定：staging-shared / production-shared
  shared:
    name: ${SHARED_NETWORK:-staging-shared}
    external: true
